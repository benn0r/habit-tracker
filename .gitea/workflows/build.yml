name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  publish-image:
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes curl docker.io jq
          docker version

      - name: Resolve registry coordinates
        id: registry
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
        run: |
          registry_host="${GITEA_URL#https://}"
          registry_host="${registry_host#http://}"
          registry_host="${registry_host%/}"
          printf 'host=%s\n' "${registry_host}" >> "${GITHUB_OUTPUT}"
          printf 'username=%s\n' "${PACKAGE_OWNER}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        shell: sh
        env:
          IMAGE_BRANCH: ${{ gitea.ref_name }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
        run: |
          image="${REGISTRY_HOST}/${REGISTRY_USERNAME}/habit-tracker"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"

          docker build --build-arg APP_VERSION="${SOURCE_COMMIT}" --tag "${image}:${branch_tag}" .
          docker push "${image}:${branch_tag}"

      - name: Remove obsolete package versions
        if: gitea.ref == 'refs/heads/main'
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          versions="$(curl --fail --silent --show-error \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/v1/packages/${PACKAGE_OWNER}?type=container&q=habit-tracker&limit=100")"

          printf '%s' "${versions}" \
            | jq -r '.[] | select(.name == "habit-tracker" and .version != "main") | .version' \
            | while IFS= read -r version; do
                status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request DELETE \
                  --header "Authorization: token ${REGISTRY_TOKEN}" \
                  "${GITEA_URL}/api/v1/packages/${PACKAGE_OWNER}/container/habit-tracker/${version}")"
                [ "${status}" = "204" ] || [ "${status}" = "404" ]
              done
