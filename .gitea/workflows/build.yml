name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload application build
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          tar --exclude=.next/cache -czf /tmp/next-build.tgz .next
          curl --fail --silent --show-error --upload-file /tmp/next-build.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/next-build.tgz"

  test:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download application build
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          curl --fail --silent --show-error --output /tmp/next-build.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/next-build.tgz"
          tar -xzf /tmp/next-build.tgz

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm test

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/test
          npm audit --omit=dev | tee artifacts/test/npm-audit.txt
          test -f .next/BUILD_ID
          cp .next/BUILD_ID artifacts/test/build-id.txt

      - name: Upload test evidence
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          tar -czf /tmp/test-evidence.tgz artifacts/test
          curl --fail --silent --show-error --upload-file /tmp/test-evidence.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/test-evidence.tgz"

  test-e2e:
    needs: build
    runs-on: ubuntu-latest-slim
    container: node:22.13.0-bookworm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download application build
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          curl --fail --silent --show-error --output /tmp/next-build.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/next-build.tgz"
          tar -xzf /tmp/next-build.tgz

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        shell: sh
        run: |
          export PORT=3100
          export HOSTNAME=0.0.0.0
          export APP_URL=http://127.0.0.1:3100
          export APP_VERSION=e2etest
          export NEXT_PUBLIC_APP_VERSION=e2etest
          export SQLITE_PATH=/tmp/habit-tracker-e2e.db
          npm run start:e2e > /tmp/e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "true" ]; then
            cat /tmp/e2e-server.log
            exit 1
          fi

          PLAYWRIGHT_EXTERNAL_SERVER=1 npm run test:e2e

      - name: Upload end-to-end evidence
        if: always()
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p playwright-report test-results
          tar -czf /tmp/e2e-evidence.tgz playwright-report test-results
          curl --fail --silent --show-error --upload-file /tmp/e2e-evidence.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/e2e-evidence.tgz"

  publish-image:
    needs: [test, test-e2e]
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download end-to-end evidence
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p artifacts/verified
          curl --fail --silent --show-error --output /tmp/e2e-evidence.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/e2e-evidence.tgz"
          tar -xzf /tmp/e2e-evidence.tgz -C artifacts/verified

      - name: Download test evidence
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          curl --fail --silent --show-error --output /tmp/test-evidence.tgz \
            --header "Authorization: token ${REGISTRY_TOKEN}" \
            "${GITEA_URL}/api/packages/${PACKAGE_OWNER}/generic/habit-tracker-ci/${SOURCE_COMMIT}/test-evidence.tgz"
          tar -xzf /tmp/test-evidence.tgz -C artifacts/verified

      - name: Verify test evidence
        run: |
          test -f artifacts/verified/test-results/e2e.xml
          test -f artifacts/verified/artifacts/test/npm-audit.txt

      - name: Install Docker CLI
        shell: sh
        run: |
          apt-get update
          apt-get install --yes curl docker.io jq
          docker version

      - name: Resolve registry coordinates
        id: registry
        shell: sh
        env:
          GITEA_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ gitea.repository_owner }}
        run: |
          registry_host="${GITEA_URL#https://}"
          registry_host="${registry_host#http://}"
          registry_host="${registry_host%/}"
          printf 'host=%s\n' "${registry_host}" >> "${GITHUB_OUTPUT}"
          printf 'username=%s\n' "${PACKAGE_OWNER}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        shell: sh
        env:
          IMAGE_BRANCH: ${{ gitea.ref_name }}
          SOURCE_COMMIT: ${{ gitea.sha }}
          REGISTRY_HOST: ${{ steps.registry.outputs.host }}
          REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
        run: |
          image="${REGISTRY_HOST}/${REGISTRY_USERNAME}/habit-tracker"
          branch_tag="$(printf '%s' "${IMAGE_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')"

          docker build --build-arg APP_VERSION="${SOURCE_COMMIT}" --tag "${image}:${branch_tag}" .
          docker push "${image}:${branch_tag}"
