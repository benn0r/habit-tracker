services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://habit:${POSTGRES_PASSWORD}@postgres:5432/habit
      AUTH_SECRET: ${AUTH_SECRET}
      TODOIST_CLIENT_ID: ${TODOIST_CLIENT_ID}
      TODOIST_CLIENT_SECRET: ${TODOIST_CLIENT_SECRET}
      APP_URL: ${APP_URL}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - "3000:3000"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: habit
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - habit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habit-data:
